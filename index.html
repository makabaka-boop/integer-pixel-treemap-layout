<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Integer-Pixel Treemap Editor</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #eef1f5;
      }
      header {
        font-family: 'Segoe UI', system-ui, sans-serif;
        margin-bottom: 14px;
      }
      header h1 {
        font-size: 18px;
        margin: 0 0 4px;
        color: #101828;
      }
      header p {
        font-size: 13px;
        color: #667085;
        margin: 0;
      }
      treemap-editor {
        background: #fff;
        border: 1px solid #e4e7ec;
        border-radius: 10px;
        padding: 16px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Integer-Pixel Treemap Editor</h1>
      <p>
        Squarified layout on an integer canvas — rows along the short side, largest-remainder
        pixel apportionment, exact sibling coverage. Edit weights to re-layout synchronously.
      </p>
    </header>
    <treemap-editor></treemap-editor>
    <script type="module" src="/src/main.ts"></script>
  </body>
